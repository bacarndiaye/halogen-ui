[package]
name = "halogen-ui"
version = "0.1.0"
edition = "2024"
description = "Live web monitor for a Halogen inference server: speed, context, prompt cache, GPU and recent requests"
license = "MIT"
readme = "README.md"
keywords = ["halogen", "llm", "monitor", "dashboard", "inference"]
categories = ["command-line-utilities", "visualization"]

# No dependencies on purpose: one small static binary, nothing to audit but this repository.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
